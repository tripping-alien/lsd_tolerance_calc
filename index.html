        }

            label_desired_sub: '(המינון שאתם רוצים להרגיש היום.)',
            button_calculate: 'חשב את המינון הנדרש',
            results_title: 'תוצאות חישוב סבילות',
            result_elapsed: 'זמן שחלף',
            result_multiplier: 'מכפיל הסבילות',
            result_status: 'סטטוס סבילות',

            hours: 'שעות',
            recovery: 'התקדמות ההתאוששות',
            copy_btn: 'העתק תוצאה',
            copied: 'הועתק!',
            disclaimer_title: '⚠️ הצהרה חיונית',
            disclaimer_body: 'מחשבון זה מבוסס על מודלים פרמקולוגיים כלליים. השפעות LSD וסבילות הן אינדיבידואליות ביותר. הכלי מיועד למטרות חינוכיות בלבד ואינו מהווה תחליף לייעוץ רפואי. אין להשתמש בו לקביעת מינון בפועל.',
            error_fill: 'אנא מלא את כל השדות.',
            error_past: 'זמן המינון האחרון חייב להיות בעבר.',
            error_positive: 'ערכי המינון חייבים להיות גדולים מ-0.',
            status_baseline: 'רגישות בסיס (אופסה לחלוטין)',
            status_high: 'סבילות גבוהה',
            status_moderate: 'סבילות בינונית',
            status_low: 'סבילות נמוכה / שרידית',
        }
    };

    // --- WebGL ---
    let scene, camera, renderer, uniforms;
    const clock = new THREE.Clock();

    const VERTEX_SHADER = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const FRAGMENT_SHADER = `
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        varying vec2 vUv;

        void main() {
            vec2 p = (vUv * 2.0 - 1.0);
            p.x *= uResolution.x / uResolution.y;

            float angle = atan(p.y, p.x);
            float radius = length(p);

            float wave1 = sin(radius * 15.0 + uTime * 2.0) * 0.05;
            float wave2 = cos(angle * 5.0 + uTime * 1.5) * 0.03;
            vec2 twisted = p + vec2(wave1, wave2);

            angle = atan(twisted.y, twisted.x);
            radius = length(twisted);

            float speed = uTime * 0.2;
            vec3 color = vec3(
                cos(angle * 3.0 + speed) * 0.5 + 0.5,
                sin(angle * 3.0 + speed + 2.0) * 0.5 + 0.5,
                cos(angle * 3.0 + speed + 4.0) * 0.5 + 0.5
            );

            float pulse = sin(radius * 5.0 - uTime) * 0.5 + 0.5;
            color *= pulse;

            float vignette = smoothstep(0.0, 1.2, radius);
            color *= (1.0 - vignette * 0.15);

            gl_FragColor = vec4(color, 1.0);
        }
    `;

    function initWebGL() {
        const canvas = document.getElementById('webgl-container');
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        uniforms = {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: VERTEX_SHADER,
            fragmentShader: FRAGMENT_SHADER
        });

        const mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), material);
        scene.add(mesh);

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function animate() {
        if (!bgPaused) {
            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animationId = requestAnimationFrame(animate);
    }

    function toggleBackground() {
        bgPaused = !bgPaused;
        const btn = document.getElementById('toggle-bg-btn');
        btn.textContent = bgPaused ? 'Resume BG' : 'Pause BG';
        if (!bgPaused) clock.start();
    }

    // --- Language ---
    function updateUI(langCode) {
        currentLang = langCode;
        const L = LANGUAGES[langCode];
        const body = document.body;
        const container = document.querySelector('.container-wrapper');

        body.style.direction = L.dir;
        body.style.fontFamily = L.font;
        container.classList.toggle('rtl', L.dir === 'rtl');

        document.getElementById('app-title-tag').textContent = L.title_main;
        document.getElementById('title-main').textContent = L.title_main;
        document.getElementById('title-sub').textContent = L.title_sub;
        document.getElementById('info-paragraph').textContent = L.info_paragraph;
        document.getElementById('label-time').textContent = L.label_time;
        document.getElementById('label-last-dose').textContent = L.label_last_dose;
        document.getElementById('label-desired-dose').textContent = L.label_desired_dose;
        document.getElementById('label-desired-sub').textContent = L.label_desired_sub;
        document.getElementById('button-calculate').textContent = L.button_calculate;
        document.getElementById('disclaimer-title').textContent = L.disclaimer_title;
        document.getElementById('disclaimer-body').textContent = L.disclaimer_body;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === langCode);
        });

        localStorage.setItem(LANG_STORAGE_KEY, langCode);
        document.getElementById('output').innerHTML = '';
    }

    // --- Calculation ---
    function getBaseMultiplier(hoursDiff) {
        const days = hoursDiff / 24;
        if (days < 0.5) return 3.5;
        if (days < 1)   return 2.5;
        if (days < 2)   return 1.8;
        if (days < 3)   return 1.4;
        if (days < 4)   return 1.2;
        if (days < 5)   return 1.1;
        if (days < 6)   return 1.05;
        if (days < 7)   return 1.02;
        return 1.0;
    }

    // Mild intensity factor: larger previous doses leave slightly more residual tolerance
    function getIntensityFactor(lastDose) {
        if (lastDose <= 50) return 0.95;
        if (lastDose <= 100) return 1.00;
        if (lastDose <= 150) return 1.05;
        if (lastDose <= 200) return 1.10;
        return 1.15;
    }

    function getStatus(multiplier, L) {
        if (multiplier <= 1.02) return { text: L.status_baseline, cls: 'status-green' };
        if (multiplier > 2.0)   return { text: L.status_high,     cls: 'status-red' };
        if (multiplier > 1.3)   return { text: L.status_moderate, cls: 'status-orange' };
        return { text: L.status_low, cls: 'status-yellow' };
    }

    function calculateTolerance() {
        const L = LANGUAGES[currentLang];
        const timeVal = document.getElementById('lastDoseTime').value;
        const lastDose = parseFloat(document.getElementById('lastDoseMg').value);
        const desired  = parseFloat(document.getElementById('desiredDoseMg').value);
        const out = document.getElementById('output');

        out.innerHTML = '';

        if (!timeVal || isNaN(lastDose) || isNaN(desired)) {
            out.innerHTML = `<p class="text-red-400 font-medium mt-3">${L.error_fill}</p>`;
            return;
        }
        if (lastDose <= 0 || desired <= 0) {
            out.innerHTML = `<p class="text-red-400 font-medium mt-3">${L.error_positive}</p>`;
            return;
        }

        const lastTime = new Date(timeVal).getTime();
        const now = Date.now();
        if (lastTime >= now) {
            out.innerHTML = `<p class="text-red-400 font-medium mt-3">${L.error_past}</p>`;
            return;
        }

        const hoursDiff = (now - lastTime) / 3600000;
        const daysDiff = hoursDiff / 24;

        let multiplier = getBaseMultiplier(hoursDiff) * getIntensityFactor(lastDose);
        multiplier = Math.max(1.0, Math.round(multiplier * 100) / 100);

        const required = Math.round(desired * multiplier);
        const hoursLeft = Math.max(0, 168 - hoursDiff);
        const daysLeft = Math.floor(hoursLeft / 24);
        const hrsLeft = Math.round(hoursLeft % 24);
        const recoveryPct = Math.min(100, Math.round((hoursDiff / 168) * 100));

        const status = getStatus(multiplier, L);

        const resultText = `${L.result_required} ${desired}μg → ${required}μg (${multiplier.toFixed(2)}×)`;

        out.innerHTML = `
            <div class="result-box p-5 rounded-xl">
                <h2 class="text-lg font-bold mb-4">${L.results_title}</h2>

                <div class="space-y-2 text-sm sm:text-base">
                    <p><span class="text-gray-400">${L.result_elapsed}:</span> 
                       <span class="font-medium">${daysDiff.toFixed(1)} ${L.days} (${Math.round(hoursDiff)} ${L.hours})</span></p>
                    <p><span class="text-gray-400">${L.result_multiplier}:</span> 
                       <span class="font-mono text-lg text-purple-300">${multiplier.toFixed(2)}×</span></p>
                    <p><span class="text-gray-400">${L.result_status}:</span> 
                       <span class="${status.cls} font-semibold">${status.text}</span></p>
                </div>

                <div class="mt-5 p-4 bg-black/40 rounded-lg text-center border border-purple-500/40">
                    <p class="text-sm text-gray-300 mb-1">${L.result_required} ${desired}μg</p>
                    <p class="text-3xl font-extrabold text-purple-300">${required} μg</p>
                </div>

                <div class="mt-5">
                    <div class="flex justify-between text-xs text-gray-400 mb-1.5">
                        <span>${L.recovery}</span>
                        <span>${recoveryPct}%</span>
                    </div>
                    <div class="recovery-track">
                        <div class="recovery-fill" style="width: ${recoveryPct}%"></div>
                    </div>
                </div>

                ${multiplier > 1.02 ? `
                    <p class="text-sm text-gray-400 mt-4">
                        ${L.result_wait} <strong class="text-gray-200">${daysLeft} ${L.days}, ${hrsLeft} ${L.hours}</strong>
                    </p>
                ` : ''}

                <button onclick="copyResult(\`${resultText}\`)" 
                        class="mt-4 text-xs px-3 py-1.5 rounded-full bg-purple-900/50 hover:bg-purple-800 text-purple-200 transition">
                    ${L.copy_btn}
                </button>
            </div>
        `;
    }

    function copyResult(text) {
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const original = btn.textContent;
            btn.textContent = LANGUAGES[currentLang].copied;
            setTimeout(() => btn.textContent = original, 1500);
        });
    }

    // --- Init ---
    window.onload = function() {
        initWebGL();

        let lang = localStorage.getItem(LANG_STORAGE_KEY) || 
                   (navigator.language || '').substring(0, 2).toUpperCase();
        if (!LANGUAGES[lang]) lang = 'EN';
        updateUI(lang);

        // Default: 48 hours ago
        const past = new Date(Date.now() - 48 * 3600000);
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('lastDoseTime').value = 
            `${past.getFullYear()}-${pad(past.getMonth()+1)}-${pad(past.getDate())}T${pad(past.getHours())}:${pad(past.getMinutes())}`;
    };
</script>
</body>
</html>
